version: '3.8'

services:
  db:
    image: postgres:15
    container_name: eye_compass_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eye_compass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eye_compass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
